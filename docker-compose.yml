services:
  mysql:
    image: mysql:8.4
    container_name: rag-demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rag_demo
      MYSQL_USER: rag_user
      MYSQL_PASSWORD: rag_password
      MYSQL_ROOT_PASSWORD: rag_root_password
    ports:
      - "13306:3306"
    volumes:
      - rag_demo_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u rag_user -prag_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch:8.11.3
    container_name: rag-demo-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - rag_demo_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    container_name: rag-demo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rag_demo_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rag-demo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rag_user
      RABBITMQ_DEFAULT_PASS: rag_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rag_demo_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  checkpoint-postgres:
    image: postgres:17-alpine
    container_name: rag-demo-checkpoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: checkpoint_db
      POSTGRES_USER: checkpoint_user
      POSTGRES_PASSWORD: checkpoint_password
    ports:
      - "15432:5432"
    volumes:
      - rag_demo_checkpoint_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkpoint_user -d checkpoint_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rag_demo_mysql_data:
  rag_demo_elasticsearch_data:
  rag_demo_minio_data:
  rag_demo_rabbitmq_data:
  rag_demo_checkpoint_postgres_data:
