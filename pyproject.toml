[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-lab"
version = "0.1.0"
description = "A small, observable RAG learning project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncmy>=0.2,<1.0",
    "elasticsearch[async]>=8.15,<9.0",
    "aio-pika>=9.4,<10.0",
    "minio>=7.2,<8.0",
    "pypdf>=5,<7",
    "httpx>=0.27,<1.0",
    "tiktoken>=0.8,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]
demo = [
    "Pillow>=10.0,<12.0",
    "reportlab>=4.0,<5.0",
]
agent = [
    "langchain==0.3.27",
    "langchain-openai==0.3.35",
    "openai==2.44.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
